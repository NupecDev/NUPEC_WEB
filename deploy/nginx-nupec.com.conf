server {
    listen 80;
    listen [::]:80;
    server_name nupec.com www.nupec.com;

    location ~ /.well-known/acme-challenge {
        allow all;
        root /var/www/html;
    }

    location /adoptaunmextizo/ {
        # Sin barra final en proxy_pass: nginx preserva el path completo
        # (incluido /adoptaunmextizo/) al reenviarlo al backend.
        proxy_pass http://107.170.246.227;
        proxy_http_version 1.1;
        # El backend fuerza redirect a https://nupec.com/ cuando recibe
        # Host: nupec.com (regla propia de ese WordPress). Se envía la IP
        # del backend como Host para evitar el loop de redirects.
        proxy_set_header Host 107.170.246.227;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
